<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d89d" />
      <stop offset="50%" stop-color="#dfb76c" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
  </defs>

  <!-- Left Emblem: Architectural Diamond & Monogram IC -->
  <g transform="translate(10, 5)">
    <rect x="5" y="5" width="50" height="50" rx="6" transform="rotate(45 30 30)" fill="rgba(255, 255, 255, 0.08)" stroke="url(#goldGradWhite)" stroke-width="1.8" />
    <circle cx="30" cy="30" r="22" fill="none" stroke="rgba(243, 216, 157, 0.4)" stroke-width="1" stroke-dasharray="2 2" />
    
    <text x="23" y="38" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">I</text>
    <text x="35" y="38" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" font-style="italic" fill="url(#goldGradWhite)" text-anchor="middle">C</text>

    <circle cx="30" cy="9" r="1.5" fill="url(#goldGradWhite)" />
    <circle cx="30" cy="51" r="1.5" fill="url(#goldGradWhite)" />
  </g>

  <!-- Right Typography for Dark Footer -->
  <g transform="translate(85, 0)">
    <text x="2" y="22" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="4" fill="rgba(255,255,255,0.6)" text-transform="uppercase">THE</text>
    
    <text x="0" y="45" font-family="'Playfair Display', 'Alegreya', Georgia, serif" font-size="26" font-weight="800" letter-spacing="1.5" fill="#ffffff">
      INTENTIONAL <tspan fill="url(#goldGradWhite)" font-style="italic" font-weight="600">CHIC</tspan>
    </text>

    <text x="2" y="60" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.2" fill="url(#goldGradWhite)" text-transform="uppercase">
      WEALTH &bull; INTENTIONAL LIVING &bull; QUIET LUXURY
    </text>
  </g>
</svg>
